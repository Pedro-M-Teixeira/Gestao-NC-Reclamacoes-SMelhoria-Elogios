<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de NC, Reclamações, Sugestões de Melhoria e Elogios · Unidade de Ensino</title>
<style>
:root{
  --bg:#ECF0EF; --surface:#FFFFFF; --surface-2:#F5F7F6;
  --ink:#152A2E; --ink-soft:#4B6167; --line:#D7DEDC;
  --petrol:#0E4A54; --petrol-deep:#092E35; --petrol-tint:#E3EDEE;
  --ok:#2E7D5B; --ok-bg:#E4F1EA;
  --warn:#9A6B12; --warn-bg:#F7EDD8;
  --bad:#A93A32; --bad-bg:#F6E4E2;
  --info:#2F6DAE; --info-bg:#E5EEF7;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --radius:10px; --shadow:0 1px 3px rgba(9,46,53,.08),0 4px 16px rgba(9,46,53,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--petrol-deep);color:#DCE8E9;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand h1{font-size:15px;font-weight:700;color:#fff;line-height:1.25}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:#8FB4B9;margin-top:4px;letter-spacing:.05em}
.nav{padding:12px 10px;flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:#C9DADC;text-decoration:none;font-size:13.5px;margin:2px 0}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--petrol);color:#fff;font-weight:600}
.nav a .n{font-family:var(--mono);font-size:12px;color:#7FA3A8;min-width:18px;text-align:center}
.nav a.active .n{color:#BFE0E4}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:999px;font-size:11px;padding:1px 7px}
.sidebar .foot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#7FA3A8;line-height:1.45}

.main{padding:24px 30px 70px;max-width:1120px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.page-head .clause{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--petrol-tint);color:var(--petrol);padding:3px 8px;border-radius:6px;margin-bottom:6px}
.page-head .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;max-width:660px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.primary:hover{background:#0B3C45}
.btn.danger{color:var(--bad);border-color:#E3C3C0}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--petrol)}
.btn.ghost:hover{background:var(--petrol-tint)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{transform:translateY(-2px);transition:transform .12s}
.card .k{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:28px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.card .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.card.alert .v{color:var(--bad)} .card.warn .v{color:var(--warn)} .card.good .v{color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.panel .panel-head{padding:12px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .panel-head h3{font-size:14px;font-weight:700}
.panel .panel-body{padding:15px 17px}

.main.wide{max-width:none}
table.grid td.wrapcell{white-space:normal}
table.grid td.wrapcell .trunc{white-space:normal;overflow:visible;text-overflow:clip;max-width:none;display:block}
table.grid td.wrapcell.desc{min-width:380px}
table.grid td.wrapcell.proc{min-width:200px}
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th{background:var(--surface-2);text-align:left;padding:9px 11px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr:hover td{background:#F8FAF9}
.code{font-family:var(--mono);font-size:12px;color:var(--petrol);white-space:nowrap}
.trunc{max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row-actions{white-space:nowrap;text-align:right}
.empty{padding:38px 20px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}

.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.search{flex:1;min-width:210px;max-width:360px;position:relative}
.search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search::before{content:"⌕";position:absolute;left:11px;top:7px;font-size:17px;color:var(--ink-soft)}
select.filter{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* ---- formulário ---- */
.form-wrap{display:grid;grid-template-columns:1fr 230px;gap:20px;align-items:start}
.fsection{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.fsection>h3{background:var(--petrol);color:#fff;font-size:13.5px;padding:10px 17px;display:flex;align-items:center;gap:9px}
.fsection>h3 .cl{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:5px;font-weight:400}
.fsection .fbody{padding:16px 17px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.field label .q{font-family:var(--mono);font-size:11px;color:var(--petrol);margin-right:5px}
.field label .req{color:var(--bad)}
.field .hint{font-size:11.5px;color:var(--ink-soft);font-style:italic}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%}
.field textarea{min-height:68px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--petrol);outline-offset:1px;border-color:var(--petrol)}
.field.err input,.field.err select,.field.err textarea,.field.err .boxlist{border-color:var(--bad);background:#FFF8F7}
.errmsg{font-size:11.5px;color:var(--bad);font-weight:600}
.boxlist{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.boxlist label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--ink);cursor:pointer}
.boxlist input{width:auto;margin-top:3px}
.ishi{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ishi .cat{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ishi .cat h4{background:var(--surface-2);font-size:12px;padding:7px 11px;color:var(--petrol);letter-spacing:.04em;text-transform:uppercase}
.ishi .cat .cl{padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.ishi .cat .cl label{display:flex;gap:7px;font-size:13px;align-items:flex-start;cursor:pointer}
.ishi .cat .cl input[type=checkbox]{width:auto;margin-top:3px}
.ishi .cat .cl input[type=text]{font-size:12.5px;padding:5px 8px}
.why{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.why .nb{background:var(--petrol-tint);color:var(--petrol);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:7px;padding:7px 10px;white-space:nowrap;margin-top:2px}
.why textarea{min-height:52px}
.sticky-side{position:sticky;top:18px;display:flex;flex-direction:column;gap:12px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.side-card h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:9px}
.side-card .big{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--petrol)}
.prog{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;height:8px;overflow:hidden;margin:7px 0}
.prog i{display:block;height:100%;background:var(--petrol)}
.side-card ul{list-style:none;font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
.side-card ul li::before{content:"•";color:var(--petrol);margin-right:6px}
.alertbox{border-left:3px solid var(--warn);background:var(--warn-bg);color:#6B4A0C;padding:9px 12px;border-radius:7px;font-size:12.5px;margin-bottom:10px}
.alertbox.bad{border-color:var(--bad);background:var(--bad-bg);color:#7D2A24}
.alertbox.info{border-color:var(--info);background:var(--info-bg);color:#1E4E7E}

.detail dl{display:grid;grid-template-columns:230px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.detail dt{background:var(--surface-2);padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.detail dd{background:var(--surface);padding:8px 12px;font-size:13.5px;white-space:pre-wrap}
.detail h3{font-size:13.5px;margin:18px 0 8px;color:var(--petrol);border-bottom:2px solid var(--petrol-tint);padding-bottom:4px}

.export-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.export-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.export-card h4{font-size:14.5px;margin-bottom:6px}
.export-card p{font-size:12.5px;color:var(--ink-soft);margin-bottom:13px;min-height:62px}
.fmt{font-family:var(--mono);font-size:11px;background:var(--petrol-tint);color:var(--petrol);padding:2px 7px;border-radius:5px;margin-bottom:9px;display:inline-block}

.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist-item:last-child{border-bottom:none}
.hist-item .ts{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;min-width:126px}
.hist-item .act{min-width:84px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--petrol-deep);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.2s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:none}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13px}
.bar .lab{min-width:190px;color:var(--ink-soft)}
.bar .track{flex:1;background:var(--surface-2);border:1px solid var(--line);height:16px;border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--petrol)}
.bar .val{font-family:var(--mono);font-size:12px;min-width:26px;text-align:right}

@media (max-width:1000px){ .form-wrap{grid-template-columns:1fr} .sticky-side{position:static} }
@media (max-width:900px){
  .app{grid-template-columns:1fr} .sidebar{position:relative;height:auto}
  .main{padding:16px 13px 60px} .fsection .fbody{grid-template-columns:1fr}
  .ishi{grid-template-columns:1fr} .detail dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ESTADOS=['Aberto','Em curso','Aguarda verificação de eficácia','Fechado','Anulado'];
const EFICACIA=['Por verificar','Sim — causas eliminadas','Parcialmente','Não — reabrir análise','Não aplicável'];

const ISHIKAWA={
 'Método':['Inexistência ou desconhecimento de processos básicos','Requisitos pouco claros','Défice de planeamento',
   'Procedimento desatualizado face à decisão tomada','Exceção não formalizada no procedimento','Falta de autonomia para a execução do processo'],
 'Mão de obra':['Falta de formação','Equipa pouco envolvida','Postura reativa','Dificuldade na mudança comportamental'],
 'Medida':['Falta de monitorização do processo','Indicador inexistente ou inadequado','Falta de confiança no processo'],
 'Material':['Impresso ou suporte documental inadequado','Informação de entrada incompleta'],
 'Máquina':['Sistema de informação indisponível ou inadequado','Equipamento ou meios insuficientes'],
 'Meio ambiente':['Falta de governação','Falta de apoio da liderança','Falta de confiança na liderança',
   'Falta de direcionamento estratégico','Condições físicas ou organizacionais inadequadas']
};

/* ---------- armazenamento ---------- */
let mem=null;
function load(){ try{ const r=localStorage.getItem(DB_KEY); if(r) return JSON.parse(r); }catch(e){} return mem||{recs:[],hist:[],seq:{}}; }
function persistRaw(){ mem=state; try{ localStorage.setItem(DB_KEY,JSON.stringify(state)); return true; }
  catch(e){ toast('Aviso: não foi possível gravar no navegador (dados apenas nesta sessão).'); return false; } }
function save(){
  if(!state.backup) state.backup={ultimo:'',pendentes:0};
  state.backup.pendentes=(state.backup.pendentes||0)+1;
  persistRaw(); agendarAuto();
}
let state=load();
if(!state.recs) state.recs=[]; if(!state.hist) state.hist=[]; if(!state.seq) state.seq={};
if(!state.backup) state.backup={ultimo:'',pendentes:0};
if(!state.catalogo) state.catalogo={
  proc:CAT_BASE.proc.map(([cod,desig,ver,nat])=>({cod,desig,ver,nat})),
  doc:CAT_BASE.doc.map(([cod,desig,ver,nat])=>({cod,desig,ver,nat}))};
function catEntry(cod){ return (state.catalogo.proc.concat(state.catalogo.doc)).find(x=>x.cod===cod); }
function labCat(cod){ const e=catEntry(cod); return e?`${e.cod} – ${e.desig}`:cod; }
function labCatV(e){ return `${e.cod} – ${e.desig}${e.ver?` (v. ${e.ver})`:''}`; }

/* ---------- utilitários ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtD(d){ if(!d) return '—'; const p=String(d).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function fmtTs(t){const d=new Date(t);return d.toLocaleDateString('pt-PT')+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});}
function nowISO(){return new Date().toISOString();}
function today(){return new Date().toISOString().slice(0,10);}
function dias(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function uid(){ return (crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random()); }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3000);}
function codigo(tipo,ano){
  const p=PREFIXO[tipo]||'REG', y=ano||new Date().getFullYear(), k=p+y;
  state.seq[k]=(state.seq[k]||0)+1;
  return `${p} ${state.seq[k]}/${y}`;
}
function logH(acao,cod,desc){ state.hist.unshift({ts:nowISO(),acao,cod:cod||'',desc:desc||''}); if(state.hist.length>1500) state.hist.length=1500; }
function arr(v){ return Array.isArray(v)?v:(v?[v]:[]); }
</script>
<script>
/* ---------- navegação ---------- */
let view='painel', editId=null, draft=null, detailId=null, errors={};
const NAV=[['painel','Painel','◈'],['registos','Registos','▤'],['novo','Novo registo','＋'],
['analise','Análise de causas','⌁'],['catalogo','Processos e documentos','▦'],
['historico','Histórico','⟲'],['exportar','Exportar / Importar','⇩']];
function buildNav(){
  $('#nav').innerHTML=NAV.map(([id,nome,ic])=>{
    const b=id==='registos'?`<span class="badge">${state.recs.length}</span>`:'';
    return `<a href="#" class="${view===id?'active':''}" onclick="go('${id}');return false;"><span class="n">${ic}</span>${nome}${b}</a>`;
  }).join('');
}
function go(v,id){
  if(v==='novo'){ editId=null; draft=novoDraft(); errors={}; }
  if(v==='editar'){ editId=id; draft=JSON.parse(JSON.stringify(state.recs.find(r=>r.id===id))); errors={}; v='novo'; }
  if(v==='detalhe'){ detailId=id; }
  view=v; buildNav(); render(); window.scrollTo(0,0);
}
function novoDraft(){
  return {tipo:'Não conformidade',origem:'',dataOcorrencia:today(),unidade:'Unidade de Ensino',processos:[],documentos:[],processosTexto:'',
  classificacao:'Menor',especificacao:'',evidencias:'',acaoImediata:'',responsaveis:[],dataInicio:'',dataLimite:'',
  p1:'',p2:'',p3:'',p4:'',p5:'',ishikawa:{},ishikawaOutro:{},causaRaiz:'',alternativa:'',
  w_what:'',w_why:'',w_where:'',w_when:'',w_who:'',w_how:'',w_howmuch:'',
  eficacia:'Por verificar',eficaciaDesc:'',eficaciaEvid:'',dataAvaliacao:'',avaliadores:[],
  estado:'Aberto',atualizaRiscos:'Não',riscosQuais:'',mudancasSGQ:'Não',mudancasOnde:'',
  finalizadoPor:'',dataFinal:'',observacoes:''};
}
function render(){
  const m=$('#main'); if(m) m.className=(view==='registos')?'main wide':'main';
  if(view==='painel') return painel();
  if(view==='registos') return lista();
  if(view==='novo') return formulario();
  if(view==='detalhe') return detalhe();
  if(view==='analise') return analise();
  if(view==='catalogo') return catalogo();
  if(view==='importar') return telaImport();
  if(view==='historico') return historico();
  if(view==='exportar') return exportar();
}

/* ---------- componentes de campo ---------- */
function fSel(q,lab,key,opts,req,hint,full){
  return `<div class="field ${full?'full':''} ${errors[key]?'err':''}">
    <label><span class="q">${q}.</span>${lab}${req?' <span class="req">*</span>':''}</label>
    <select onchange="setF('${key}',this.value)">${!draft[key]?'<option value=""></option>':''}
      ${opts.map(o=>`<option ${o===draft[key]?'selected':''}>${esc(o)}</option>`).join('')}</select>
    ${hint?`<span class="hint">${hint}</span>`:''}${errors[key]?`<span class="errmsg">${errors[key]}</span>`:''}</div>`;
}
function fTxt(q,lab,key,req,hint,full,type){
  return `<div class="field ${full?'full':''} ${errors[key]?'err':''}">
    <label><span class="q">${q}.</span>${lab}${req?' <span class="req">*</span>':''}</label>
    <input type="${type||'text'}" value="${esc(draft[key])}" oninput="setF('${key}',this.value)">
    ${hint?`<span class="hint">${hint}</span>`:''}${errors[key]?`<span class="errmsg">${errors[key]}</span>`:''}</div>`;
}
function fArea(q,lab,key,req,hint,full){
  return `<div class="field ${full!==false?'full':''} ${errors[key]?'err':''}">
    <label><span class="q">${q}.</span>${lab}${req?' <span class="req">*</span>':''}</label>
    <textarea oninput="setF('${key}',this.value)">${esc(draft[key])}</textarea>
    ${hint?`<span class="hint">${hint}</span>`:''}${errors[key]?`<span class="errmsg">${errors[key]}</span>`:''}</div>`;
}
function fMulti(q,lab,key,opts,req,hint){
  const sel=arr(draft[key]);
  return `<div class="field full ${errors[key]?'err':''}">
    <label><span class="q">${q}.</span>${lab}${req?' <span class="req">*</span>':''}</label>
    <div class="boxlist">${opts.map(o=>`<label><input type="checkbox" ${sel.includes(o)?'checked':''}
      onchange="togMulti('${key}',this.value,this.checked)" value="${esc(o)}">${esc(o)}</label>`).join('')}</div>
    ${hint?`<span class="hint">${hint}</span>`:''}${errors[key]?`<span class="errmsg">${errors[key]}</span>`:''}</div>`;
}
function setF(k,v){ draft[k]=v; if(errors[k]){delete errors[k];} if(['tipo','estado','eficacia','atualizaRiscos','mudancasSGQ'].includes(k)) formulario(); else sidePanel(); }
function togMulti(k,v,on){ const s=arr(draft[k]); draft[k]= on? s.concat([v]) : s.filter(x=>x!==v); if(errors[k])delete errors[k]; sidePanel(); }
let catFiltro={};
function fCat(q,lab,key,tipo,req,hint){
  const sel=arr(draft[key]), f=(catFiltro[key]||'').toLowerCase();
  const itens=state.catalogo[tipo].filter(e=>!f||labCatV(e).toLowerCase().includes(f)||(e.nat||'').toLowerCase().includes(f));
  const nats=[...new Set(itens.map(e=>e.nat||'—'))];
  const corpo=nats.map(n=>`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--petrol);margin:6px 0 2px">${esc(n)}</div>`+
    itens.filter(e=>(e.nat||'—')===n).map(e=>`<label><input type="checkbox" ${sel.includes(e.cod)?'checked':''}
      onchange="togMulti('${key}',this.value,this.checked)" value="${esc(e.cod)}">${esc(labCatV(e))}</label>`).join('')).join('');
  return `<div class="field full ${errors[key]?'err':''}">
    <label>${q?`<span class="q">${q}.</span>`:''}${lab}${req?' <span class="req">*</span>':''}</label>
    <div style="display:flex;gap:7px;margin-bottom:6px;flex-wrap:wrap">
      <input type="text" style="flex:1;min-width:180px" placeholder="Filtrar o catálogo…" value="${esc(catFiltro[key]||'')}"
        oninput="catFiltro['${key}']=this.value;formulario();setTimeout(()=>{const i=document.querySelector('[data-f=\'${key}\']');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0)" data-f="${key}">
      <button type="button" class="btn small" onclick="novoCat('${tipo}','${key}')">＋ Novo ${tipo==='proc'?'processo':'documento'}</button>
    </div>
    <div class="boxlist">${corpo||'<span class="hint">Sem resultados para o filtro.</span>'}</div>
    ${sel.length?`<span class="hint">Selecionados: ${sel.map(c=>esc(labCat(c))).join(' · ')}</span>`:''}
    ${hint?`<span class="hint">${hint}</span>`:''}${errors[key]?`<span class="errmsg">${errors[key]}</span>`:''}</div>`;
}
function novoCat(tipo,key){
  const cod=prompt(tipo==='proc'
    ? 'Código do novo processo (por exemplo, ULSG.UE.PO.011):'
    : 'Código do novo documento (por exemplo, ULSG.UE.Imp.039):');
  if(!cod||!cod.trim()) return;
  const c=cod.trim();
  if(catEntry(c)){ toast('Já existe uma entrada com esse código.'); return; }
  const desig=prompt('Designação:'); if(!desig||!desig.trim()) return;
  const ver=(prompt('Versão (pode deixar em branco):')||'').trim();
  const nat=tipo==='proc'
    ? (prompt('Natureza (Processo da Qualidade / Procedimento Interno / Procedimento Operativo):','Procedimento Operativo')||'Processo').trim()
    : (prompt('Natureza (Impresso / Modelo / Regulamento / Política / Manual / Relatório / Instrução de Trabalho):','Impresso')||'Impresso').trim();
  state.catalogo[tipo].push({cod:c,desig:desig.trim(),ver,nat});
  state.catalogo[tipo].sort((a,b)=>a.cod.localeCompare(b.cod,'pt'));
  if(key){ draft[key]=arr(draft[key]).concat([c]); }
  logH('Catálogo',c,`Nova entrada: ${desig.trim()}`); save();
  if(key) formulario(); else render();
  toast('Entrada acrescentada ao catálogo.');
}
function togIshi(cat,causa,on){ const s=arr(draft.ishikawa[cat]); draft.ishikawa[cat]= on? s.concat([causa]) : s.filter(x=>x!==causa); if(errors.causas)delete errors.causas; sidePanel(); }
function setIshiOutro(cat,v){ draft.ishikawaOutro[cat]=v; sidePanel(); }
</script>
<script>
/* ---------- formulário ---------- */
function formulario(){
  const isNC=draft.tipo==='Não conformidade'||draft.tipo==='Reclamação';
  const isElogio=draft.tipo==='Elogio';
  const sec=(titulo,cl,body)=>`<div class="fsection"><h3>${titulo}${cl?`<span class="cl">${cl}</span>`:''}</h3><div class="fbody">${body}</div></div>`;

  const s1=sec('Descrição do evento','10.2.1',
    fSel(1,'Tipo','tipo',TIPOS,1)+
    fSel(2,'Origem','origem',ORIGENS,1)+
    fTxt(3,'Data da ocorrência','dataOcorrencia',1,'','','date')+
    fSel(4,'Unidade','unidade',UNIDADES,1)+
    (isNC?fSel(0,'Classificação','classificacao',CLASSIF,0,'Maior: falha sistémica ou do requisito. Menor: desvio pontual.'):'')+
    fCat(5,'Processo(s) abrangido(s)','processos','proc',isNC,'Lista conforme ULSG.UE.Imp.009 — Controlo de Documentos do SGQ.')+
    fCat(0,'Documento(s) associado(s)','documentos','doc',0,'Impressos, modelos, regulamentos e demais documentação do SGQ envolvida.')+
    fTxt(0,'Outra referência (texto livre)','processosTexto',0,'Use apenas quando a referência não consta do catálogo.','full')+
    fArea(6,'Especificação — descrição do que ocorreu','especificacao',1,'Factos observados, sem juízo de causa. Indique o requisito ou o documento em causa.')+
    fArea(7,'Evidências e anexos','evidencias',0,'Identifique os documentos, e-mails ou registos que suportam a ocorrência e onde estão arquivados.'));

  const s2=sec(isElogio?'Encaminhamento':'Correção / ação imediata',isElogio?'':'10.2.1 a)',
    fArea(8,isElogio?'O que fazer — encaminhamento e divulgação':'O que fazer — correção imediata','acaoImediata',isNC,'Ação para conter o efeito. Distinta da ação corretiva, que elimina a causa.')+
    fMulti(9,'Quem vai fazer','responsaveis',PESSOAS,isNC)+
    fTxt(10,'Quando — início','dataInicio',0,'','','date')+
    fTxt(11,'Até quando — prazo limite','dataLimite',isNC,'','','date'));

  const whys=[1,2,3,4,5].map(i=>`<div class="why"><span class="nb">Porquê ${i}</span>
    <textarea placeholder="${i===1?'Porque é que a ocorrência aconteceu?':'Porque é que a resposta anterior se verifica?'}"
      oninput="setF('p${i}',this.value)">${esc(draft['p'+i])}</textarea></div>`).join('');
  const s3=sec('Análise dos cinco porquês','10.2.1 b)',
    `<div class="field full ${errors.causas?'err':''}">
      <span class="hint">Encadeie as respostas: cada «porquê» responde ao anterior. Não é obrigatório chegar ao quinto nível — é obrigatório chegar a uma causa sobre a qual a Unidade possa agir.</span>
      ${whys}${errors.causas?`<span class="errmsg">${errors.causas}</span>`:''}</div>`);

  const ishi=Object.entries(ISHIKAWA).map(([cat,causas])=>{
    const sel=arr(draft.ishikawa[cat]);
    return `<div class="cat"><h4>${cat}</h4><div class="cl">
      ${causas.map(c=>`<label><input type="checkbox" ${sel.includes(c)?'checked':''}
        onchange="togIshi('${cat}',this.value,this.checked)" value="${esc(c)}">${esc(c)}</label>`).join('')}
      <input type="text" placeholder="Outra causa (${cat.toLowerCase()})…" value="${esc(draft.ishikawaOutro[cat]||'')}"
        oninput="setIshiOutro('${cat}',this.value)"></div></div>`;
  }).join('');
  const s4=sec('Diagrama de Ishikawa — causas por categoria','10.2.1 b)',
    `<div class="field full ${errors.causas?'err':''}"><span class="hint">É obrigatório o preenchimento de pelo menos um dos métodos de análise de causas: cinco porquês ou Ishikawa.</span>
      <div class="ishi" style="margin-top:8px">${ishi}</div>
      ${errors.causas?`<span class="errmsg">${errors.causas}</span>`:''}</div>`+
    fArea(18,'Causa raiz — descrição','causaRaiz',isNC,'Formule a causa de modo a que a sua eliminação impeça a repetição. Se a formulação apontar para uma pessoa e não para o processo, a análise ainda não terminou.')+
    fArea(19,'Hipótese alternativa de causa','alternativa',0,'Outra explicação plausível que foi ponderada e a razão por que foi afastada.'));

  const s5=sec('Plano de ação corretiva — 5W2H','10.2.1 d)',
    fArea(20,'What — o que vai ser executado','w_what',isNC)+
    fArea(21,'Why — porquê','w_why',0,'Deve remeter para a causa raiz identificada.')+
    fTxt(22,'Where — onde','w_where')+
    fTxt(23,'When — quando','w_when',0,'Data ou prazo concreto; evite «imediatamente».')+
    fTxt(24,'Who — responsável pela execução','w_who',isNC)+
    fArea(25,'How — método de execução','w_how')+
    fTxt(26,'How much — custo estimado','w_howmuch',0,'Indique «sem custo» quando aplicável.'));

  const s6=sec('Implementação e verificação da eficácia','10.2.1 e) / 9.1.3',
    fSel(27,'As ações eliminaram as causas da não conformidade?','eficacia',EFICACIA,0)+
    fTxt(30,'Data da verificação','dataAvaliacao',0,'','','date')+
    fArea(28,'Verificação da eficácia — descrição','eficaciaDesc',0,'O que foi verificado e com que dados. «Sim» sem evidência não é verificação.')+
    fArea(29,'Evidência da verificação','eficaciaEvid',0)+
    fMulti(31,'Quem verificou','avaliadores',PESSOAS));

  const s7=sec('Atualização do Sistema de Gestão da Qualidade','6.1 / 10.3',
    fSel(32,'Resultado / estado do registo','estado',ESTADOS,1)+
    fSel(33,'Há necessidade de atualizar riscos e oportunidades?','atualizaRiscos',['Sim','Não'],1)+
    (draft.atualizaRiscos==='Sim'?fArea(0,'Riscos ou oportunidades a atualizar (ULSG.Imp.148)','riscosQuais',0,'Indique o identificador do risco, por exemplo R06.'):'')+
    fSel(34,'Há necessidade de realizar mudanças no SGQ?','mudancasSGQ',['Sim','Não'],1)+
    (draft.mudancasSGQ==='Sim'?fArea(35,'Onde? Processos e documentos a alterar','mudancasOnde',1):'')+
    fSel(36,'Quem finalizou o presente relatório','finalizadoPor',PESSOAS,0)+
    fTxt(37,'Data','dataFinal',0,'','','date')+
    fArea(0,'Observações','observacoes'));

  $('#main').innerHTML=`
    <div class="page-head"><div>
      <span class="clause">Cláusula 10.2 · NP EN ISO 9001:2015</span>
      <h2>${editId?'Editar registo':'Novo registo'}</h2>
      <div class="sub">Os campos numerados correspondem ao formulário em uso na Unidade de Ensino. Campos assinalados com <span class="req">*</span> são de preenchimento obrigatório.</div>
    </div>
    <div class="actions-row">
      <button class="btn" onclick="go('${editId?'detalhe':'registos'}','${editId||''}')">Cancelar</button>
      <button class="btn primary" onclick="guardar()">Guardar registo</button>
    </div></div>
    <div class="form-wrap">
      <div>${s1}${s2}${isElogio?'':s3+s4+s5+s6}${s7}</div>
      <div class="sticky-side" id="side"></div>
    </div>`;
  sidePanel();
}

function contaCausas(){
  let n=[1,2,3,4,5].filter(i=>(draft['p'+i]||'').trim()).length;
  Object.values(draft.ishikawa).forEach(v=>n+=arr(v).length);
  Object.values(draft.ishikawaOutro).forEach(v=>{if((v||'').trim())n++;});
  return n;
}
function avisos(){
  const a=[];
  if(draft.dataInicio&&draft.dataLimite&&draft.dataLimite<draft.dataInicio)
    a.push(['bad','O prazo limite é anterior à data de início da ação.']);
  const temAcao=draft.tipo==='Não conformidade'||draft.tipo==='Reclamação'||(draft.w_what||'').trim();
  if(draft.estado==='Fechado'&&temAcao&&draft.eficacia==='Por verificar')
    a.push(['bad','Não é possível fechar o registo sem verificar a eficácia das ações (cláusula 10.2.1 e).']);
  if(draft.estado==='Fechado'&&(draft.eficacia||'').startsWith('Sim')&&!(draft.eficaciaDesc||'').trim())
    a.push(['','Declarou a eficácia como atingida sem descrever o que foi verificado. Em auditoria, uma resposta «sim» sem evidência não é aceite.']);
  const d=dias(draft.dataLimite,draft.dataAvaliacao);
  if(d!==null&&d<30&&(draft.eficacia||'').startsWith('Sim'))
    a.push(['','A eficácia foi verificada '+(d<0?'antes':d+' dia(s) depois')+' do prazo de implementação. A verificação da eficácia pressupõe decorrido tempo suficiente para a causa se poder repetir — recomenda-se um intervalo mínimo de 30 dias.']);
  if(draft.mudancasSGQ==='Sim'&&draft.atualizaRiscos==='Não')
    a.push(['info','Vai alterar processos ou documentos do SGQ mas não assinalou a atualização de riscos. Confirme se a matriz de risco (ULSG.Imp.148) continua coerente.']);
  if(draft.estado!=='Fechado'&&draft.dataLimite&&draft.dataLimite<today())
    a.push(['','O prazo de implementação está ultrapassado e o registo continua em aberto.']);
  return a;
}
function sidePanel(){
  const el=$('#side'); if(!el) return;
  const tot=12, done=['tipo','origem','dataOcorrencia','unidade','especificacao','acaoImediata','dataLimite','causaRaiz','w_what','w_who','estado','finalizadoPor'].filter(k=>(draft[k]||'').toString().trim()).length;
  const pct=Math.round(done/tot*100);
  const av=avisos();
  el.innerHTML=`
    <div class="side-card"><h4>Identificação</h4>
      <div class="big">${editId?esc(state.recs.find(r=>r.id===editId).codigo):(PREFIXO[draft.tipo]||'REG')+' …/'+new Date().getFullYear()}</div>
      <div class="hint" style="font-size:12px;color:var(--ink-soft);margin-top:4px">${editId?'Código atribuído':'Código atribuído ao guardar'}</div>
    </div>
    <div class="side-card"><h4>Preenchimento</h4>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div style="font-size:12.5px;color:var(--ink-soft)">${done} de ${tot} campos estruturantes · ${pct}%</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px">Causas identificadas: <strong>${contaCausas()}</strong></div>
    </div>
    ${av.length?`<div class="side-card"><h4>Verificações</h4>${av.map(([t,m])=>`<div class="alertbox ${t}">${m}</div>`).join('')}</div>`:''}
    <div class="side-card"><h4>Sequência</h4><ul>
      <li>Descrever o facto, não a causa</li>
      <li>Correção contém; ação corretiva elimina</li>
      <li>Causa sobre a qual se pode agir</li>
      <li>Fechar só após verificar a eficácia</li>
    </ul></div>`;
}

function guardar(){
  errors={};
  const isNC=draft.tipo==='Não conformidade'||draft.tipo==='Reclamação';
  const req={tipo:'Indique o tipo de registo.',origem:'Indique a origem.',dataOcorrencia:'Indique a data da ocorrência.',
    unidade:'Indique a unidade.',especificacao:'Descreva o que ocorreu.',estado:'Indique o estado do registo.'};
  Object.entries(req).forEach(([k,m])=>{ if(!(draft[k]||'').toString().trim()) errors[k]=m; });
  if(isNC){
    if(!arr(draft.processos).length) errors.processos='Indique pelo menos um processo abrangido.';
    if(!(draft.acaoImediata||'').trim()) errors.acaoImediata='Indique a correção imediata.';
    if(!arr(draft.responsaveis).length) errors.responsaveis='Indique quem executa a correção.';
    if(!(draft.dataLimite||'').trim()) errors.dataLimite='Fixe um prazo limite.';
    if(contaCausas()===0) errors.causas='Preencha pelo menos um dos métodos de análise de causas.';
    if(!(draft.causaRaiz||'').trim()) errors.causaRaiz='Descreva a causa raiz.';
    if(!(draft.w_what||'').trim()) errors.w_what='Indique a ação corretiva a executar.';
    if(!(draft.w_who||'').trim()) errors.w_who='Indique o responsável pela execução.';
  }
  if(draft.mudancasSGQ==='Sim'&&!(draft.mudancasOnde||'').trim()) errors.mudancasOnde='Indique os processos ou documentos a alterar.';
  const temAcao=isNC||(draft.w_what||'').trim();
  if(draft.estado==='Fechado'&&temAcao&&draft.eficacia==='Por verificar')
    errors.eficacia='Verifique a eficácia antes de fechar o registo.';
  if(Object.keys(errors).length){
    formulario();
    const f=document.querySelector('.field.err'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'center',behavior:'smooth'});
    toast('Há campos obrigatórios por preencher.');
    return;
  }
  if(editId){
    const r=state.recs.find(x=>x.id===editId);
    Object.assign(r,draft,{atualizadoEm:nowISO()});
    logH('Atualização',r.codigo,(r.especificacao||'').slice(0,90));
    save(); toast(`Registo ${r.codigo} atualizado.`); go('detalhe',r.id);
  }else{
    const r=Object.assign({id:uid(),codigo:codigo(draft.tipo),criadoEm:nowISO()},draft);
    state.recs.unshift(r);
    logH('Criação',r.codigo,(r.especificacao||'').slice(0,90));
    save(); toast(`Registo ${r.codigo} criado.`); go('detalhe',r.id);
  }
}
</script>
<script>
/* ---------- chips de estado ---------- */
const CH_EST={'Aberto':'bad','Em curso':'info','Aguarda verificação de eficácia':'warn','Fechado':'ok','Anulado':'neutral'};
const CH_TIPO={'Não conformidade':'bad','Reclamação':'warn','Sugestão de melhoria':'info','Elogio':'ok'};
const CH_EF={'Por verificar':'warn','Sim — causas eliminadas':'ok','Parcialmente':'warn','Não — reabrir análise':'bad','Não aplicável':'neutral'};
function chip(v,map){ return v?`<span class="chip ${map[v]||'neutral'}">${esc(v)}</span>`:'—'; }
function emAtraso(r){ return r.estado!=='Fechado'&&r.estado!=='Anulado'&&r.dataLimite&&r.dataLimite<today(); }

/* ---------- lista ---------- */
function lista(){
  $('#main').innerHTML=`
    <div class="page-head"><div>
      <span class="clause">Registos</span><h2>Registos da Unidade de Ensino</h2>
      <div class="sub">Não conformidades, reclamações, sugestões de melhoria e elogios registados, com o respetivo estado de tratamento.</div>
    </div><div class="actions-row">
      <button class="btn" onclick="go('exportar')">⇩ Exportar</button>
      <button class="btn primary" onclick="go('novo')">＋ Novo registo</button>
    </div></div>
    <div class="toolbar">
      <div class="search"><input id="q" placeholder="Pesquisar em ${state.recs.length} registo(s)…" oninput="linhas()"></div>
      <select class="filter" id="fT" onchange="linhas()"><option value="">Todos os tipos</option>${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>
      <select class="filter" id="fE" onchange="linhas()"><option value="">Todos os estados</option>${ESTADOS.map(t=>`<option>${t}</option>`).join('')}</select>
    </div>
    <div class="panel"><div class="table-wrap" id="tbl"></div></div>`;
  linhas();
}
function filtra(){
  const q=($('#q')?.value||'').toLowerCase(), t=$('#fT')?.value||'', e=$('#fE')?.value||'';
  return state.recs.filter(r=>(!t||r.tipo===t)&&(!e||r.estado===e)&&
    (!q||JSON.stringify(r).toLowerCase().includes(q)));
}
function linhas(){
  const rs=filtra();
  if(!rs.length){ $('#tbl').innerHTML=`<div class="empty"><div class="big">Sem registos</div>Crie o primeiro registo com o botão «Novo registo».</div>`; return; }
  $('#tbl').innerHTML=`<table class="grid"><thead><tr>
    <th>Código</th><th>Tipo</th><th>Data</th><th>Descrição</th><th>Processo</th><th>Prazo</th><th>Eficácia</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rs.map(r=>`<tr>
      <td><span class="code">${esc(r.codigo)}</span></td>
      <td>${chip(r.tipo,CH_TIPO)}</td>
      <td>${fmtD(r.dataOcorrencia)}</td>
      <td class="wrapcell desc"><span class="trunc" title="${esc(r.especificacao)}">${esc(r.especificacao)||'—'}</span></td>
      <td class="wrapcell proc" title="${esc(arr(r.processos).concat(arr(r.documentos)).map(labCat).join('; '))}">${esc(arr(r.processos).concat(arr(r.documentos)).map(c=>c.replace('ULSG.UE.','').replace('ULSG.','')).join(', '))||'—'}</td>
      <td>${fmtD(r.dataLimite)}${emAtraso(r)?' <span class="chip bad">em atraso</span>':''}</td>
      <td>${chip(r.eficacia,CH_EF)}</td>
      <td>${chip(r.estado,CH_EST)}</td>
      <td class="row-actions">
        <button class="btn small ghost" onclick="go('detalhe','${r.id}')">Abrir</button>
        <button class="btn small ghost" onclick="go('editar','${r.id}')">Editar</button>
        <button class="btn small danger" onclick="apagar('${r.id}')">Eliminar</button></td></tr>`).join('')}
  </tbody></table>`;
}
function apagar(id){
  const r=state.recs.find(x=>x.id===id); if(!r) return;
  if(!confirm(`Eliminar o registo ${r.codigo}?\n\nA eliminação fica assinalada no histórico e não pode ser anulada.`)) return;
  state.recs=state.recs.filter(x=>x.id!==id);
  logH('Eliminação',r.codigo,(r.especificacao||'').slice(0,90));
  save(); render(); buildNav(); toast(`Registo ${r.codigo} eliminado.`);
}

/* ---------- detalhe ---------- */
function linhasIshi(r){
  const out=[];
  Object.keys(ISHIKAWA).forEach(c=>{
    const v=arr(r.ishikawa&&r.ishikawa[c]).slice();
    const o=(r.ishikawaOutro&&r.ishikawaOutro[c]||'').trim(); if(o) v.push(o+' (outra)');
    if(v.length) out.push([c,v]);
  });
  return out;
}
function detalhe(){
  const r=state.recs.find(x=>x.id===detailId);
  if(!r){ go('registos'); return; }
  const dl=(t,v)=>`<dt>${t}</dt><dd>${v||'—'}</dd>`;
  const whys=[1,2,3,4,5].filter(i=>(r['p'+i]||'').trim()).map(i=>dl('Porquê '+i,esc(r['p'+i]))).join('');
  const ishi=linhasIshi(r).map(([c,v])=>dl(c,esc(v.join(' · ')))).join('');
  const prazoTxt=fmtD(r.dataLimite)+(emAtraso(r)?' — em atraso':'');
  const ciclo=dias(r.dataOcorrencia,r.dataFinal);
  $('#main').innerHTML=`
    <div class="page-head"><div>
      <span class="clause">${esc(r.codigo)}</span><h2>${esc(r.tipo)}</h2>
      <div class="sub">${esc(r.especificacao)}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${chip(r.estado,CH_EST)}${chip(r.eficacia,CH_EF)}${r.classificacao&&r.classificacao!=='Não aplicável'?`<span class="chip neutral">Classificação: ${esc(r.classificacao)}</span>`:''}</div>
    </div><div class="actions-row">
      <button class="btn" onclick="go('registos')">← Registos</button>
      <button class="btn" onclick="pdfRegisto('${r.id}')">⎙ Relatório PDF</button>
      <button class="btn primary" onclick="go('editar','${r.id}')">Editar</button>
    </div></div>
    <div class="panel detail"><div class="panel-body">
      <h3>Descrição do evento</h3><dl>
        ${dl('Origem',esc(r.origem))}${dl('Data da ocorrência',fmtD(r.dataOcorrencia))}
        ${dl('Unidade',esc(r.unidade))}${dl('Processo(s)',esc(arr(r.processos).map(labCat).join('\n')))}
        ${arr(r.documentos).length?dl('Documento(s) associado(s)',esc(arr(r.documentos).map(labCat).join('\n'))):''}
        ${r.processosTexto?dl('Outra referência',esc(r.processosTexto)):''}
        ${dl('Especificação',esc(r.especificacao))}${dl('Evidências e anexos',esc(r.evidencias))}</dl>
      <h3>Correção / ação imediata</h3><dl>
        ${dl('O que fazer',esc(r.acaoImediata))}${dl('Quem vai fazer',esc(arr(r.responsaveis).join('; ')))}
        ${dl('Início',fmtD(r.dataInicio))}${dl('Prazo limite',prazoTxt)}</dl>
      <h3>Análise de causas</h3><dl>
        ${whys||''}${ishi||''}
        ${dl('Causa raiz',esc(r.causaRaiz))}${dl('Hipótese alternativa',esc(r.alternativa))}</dl>
      <h3>Plano de ação corretiva (5W2H)</h3><dl>
        ${dl('What — o quê',esc(r.w_what))}${dl('Why — porquê',esc(r.w_why))}${dl('Where — onde',esc(r.w_where))}
        ${dl('When — quando',esc(r.w_when))}${dl('Who — quem',esc(r.w_who))}${dl('How — como',esc(r.w_how))}
        ${dl('How much — custo',esc(r.w_howmuch))}</dl>
      <h3>Verificação da eficácia</h3><dl>
        ${dl('Resultado',esc(r.eficacia))}${dl('Data da verificação',fmtD(r.dataAvaliacao))}
        ${dl('Descrição',esc(r.eficaciaDesc))}${dl('Evidência',esc(r.eficaciaEvid))}
        ${dl('Quem verificou',esc(arr(r.avaliadores).join('; ')))}</dl>
      <h3>Atualização do SGQ</h3><dl>
        ${dl('Atualizar riscos e oportunidades',esc(r.atualizaRiscos)+(r.riscosQuais?' — '+esc(r.riscosQuais):''))}
        ${dl('Mudanças no SGQ',esc(r.mudancasSGQ)+(r.mudancasOnde?' — '+esc(r.mudancasOnde):''))}
        ${dl('Finalizado por',esc(r.finalizadoPor))}${dl('Data',fmtD(r.dataFinal))}
        ${ciclo!==null?dl('Tempo de tratamento',ciclo+' dia(s) entre a ocorrência e o encerramento'):''}
        ${dl('Observações',esc(r.observacoes))}</dl>
    </div></div>`;
}

/* ---------- histórico ---------- */
const CH_ACT={'Criação':'ok','Atualização':'info','Eliminação':'bad','Exportação':'neutral','Importação':'warn'};
function historico(){
  $('#main').innerHTML=`
    <div class="page-head"><div><span class="clause">Rastreabilidade</span><h2>Histórico de atividade</h2>
      <div class="sub">Registo cronológico das operações efetuadas. Constitui evidência de rastreabilidade para efeitos de auditoria.</div></div></div>
    <div class="toolbar"><div class="search"><input id="hq" placeholder="Pesquisar no histórico…" oninput="hLinhas()"></div></div>
    <div class="panel"><div class="panel-body" id="hl"></div></div>`;
  hLinhas();
}
function hLinhas(){
  const q=($('#hq')?.value||'').toLowerCase();
  const it=state.hist.filter(h=>!q||(h.cod+' '+h.desc+' '+h.acao).toLowerCase().includes(q));
  $('#hl').innerHTML=it.slice(0,300).map(h=>`<div class="hist-item">
    <span class="ts">${fmtTs(h.ts)}</span>
    <span class="act"><span class="chip ${CH_ACT[h.acao]||'neutral'}">${esc(h.acao)}</span></span>
    <span>${h.cod?`<span class="code">${esc(h.cod)}</span> — `:''}${esc(h.desc)}</span></div>`).join('')
    ||'<div class="empty">Sem entradas.</div>';
}
</script>
<script>
/* ---------- painel ---------- */
function metricas(){
  const R=state.recs;
  const abertos=R.filter(r=>r.estado!=='Fechado'&&r.estado!=='Anulado');
  const atraso=R.filter(emAtraso);
  const porVerificar=R.filter(r=>r.estado!=='Anulado'&&r.tipo!=='Elogio'&&r.eficacia==='Por verificar'&&(r.w_what||'').trim());
  const nc=R.filter(r=>r.tipo==='Não conformidade');
  const fechados=R.filter(r=>r.estado==='Fechado'&&r.dataOcorrencia&&r.dataFinal);
  const tmed=fechados.length?Math.round(fechados.reduce((s,r)=>s+dias(r.dataOcorrencia,r.dataFinal),0)/fechados.length):null;
  const reabrir=R.filter(r=>r.eficacia==='Não — reabrir análise').length;
  return {tot:R.length,abertos:abertos.length,atraso:atraso.length,porVerificar:porVerificar.length,nc:nc.length,tmed,reabrir};
}
function barras(mapa,total){
  const max=Math.max(1,...Object.values(mapa));
  return Object.entries(mapa).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div class="bar"><span class="lab">${esc(k)}</span><span class="track"><i style="width:${v/max*100}%"></i></span><span class="val">${v}</span></div>`).join('')
    ||'<div style="color:var(--ink-soft);font-size:13px">Sem dados.</div>';
}
function painel(){
  const m=metricas();
  const porTipo={}; TIPOS.forEach(t=>porTipo[t]=state.recs.filter(r=>r.tipo===t).length);
  const porOrigem={}; state.recs.forEach(r=>{ if(r.origem) porOrigem[r.origem]=(porOrigem[r.origem]||0)+1; });
  const cards=[
    {v:m.abertos,k:'Registos em aberto',d:'por encerrar',c:m.abertos?'warn':'good',go:'registos'},
    {v:m.atraso,k:'Prazos ultrapassados',d:'ação não concluída no prazo',c:m.atraso?'alert':'good',go:'registos'},
    {v:m.porVerificar,k:'Eficácia por verificar',d:'ações implementadas sem verificação',c:m.porVerificar?'warn':'good',go:'registos'},
    {v:m.reabrir,k:'A reabrir',d:'ações sem eficácia demonstrada',c:m.reabrir?'alert':'good',go:'registos'},
    {v:m.nc,k:'Não conformidades',d:'do total de registos',c:'',go:'registos'},
    {v:m.tmed===null?'—':m.tmed+' d',k:'Tempo médio de tratamento',d:'da ocorrência ao encerramento',c:'',go:'analise'}
  ].map(c=>`<div class="card ${c.c}" onclick="go('${c.go}')"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="d">${c.d}</div></div>`).join('');
  const recentes=state.recs.slice(0,5).map(r=>`<tr>
    <td><span class="code">${esc(r.codigo)}</span></td><td>${chip(r.tipo,CH_TIPO)}</td>
    <td><span class="trunc" title="${esc(r.especificacao)}">${esc(r.especificacao)}</span></td>
    <td>${chip(r.estado,CH_EST)}</td>
    <td class="row-actions"><button class="btn small ghost" onclick="go('detalhe','${r.id}')">Abrir</button></td></tr>`).join('');
  const seed=state.recs.length===0?`<div class="panel"><div class="panel-body" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><strong>Primeira utilização</strong><br><span style="color:var(--ink-soft);font-size:13px">Pode carregar o registo NC 1/2026 (cartão de estágio dos alunos da UBI) já migrado do formulário, para verificar o funcionamento da aplicação.</span></div>
      <button class="btn" onclick="seedDemo()">Carregar NC 1/2026</button></div></div>`:'';
  $('#main').innerHTML=`
    <div class="page-head"><div><span class="clause">Painel</span><h2>Estado do tratamento de ocorrências</h2>
      <div class="sub">Síntese para acompanhamento corrente e para as entradas da revisão pela gestão (cláusula 9.3).</div></div>
      <div class="actions-row"><button class="btn primary" onclick="go('novo')">＋ Novo registo</button></div></div>
    ${seed}
    ${bannerBackup()}
    <div class="cards">${cards}</div>
    <div class="panel"><div class="panel-head"><h3>Distribuição por tipo</h3></div><div class="panel-body">${barras(porTipo)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Distribuição por origem</h3></div><div class="panel-body">${barras(porOrigem)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Registos recentes</h3>
      <button class="btn small ghost" onclick="go('registos')">Ver todos</button></div>
      ${recentes?`<div class="table-wrap"><table class="grid"><tbody>${recentes}</tbody></table></div>`:'<div class="empty">Ainda sem registos.</div>'}</div>`;
}

/* ---------- análise de causas ---------- */
function analise(){
  const cat={}, causa={};
  Object.keys(ISHIKAWA).forEach(c=>cat[c]=0);
  state.recs.forEach(r=>{
    linhasIshi(r).forEach(([c,v])=>{ cat[c]=(cat[c]||0)+v.length; v.forEach(x=>causa[x]=(causa[x]||0)+1); });
  });
  const porProc={};
  state.recs.forEach(r=>arr(r.processos).forEach(c=>{const k=labCat(c);porProc[k]=(porProc[k]||0)+1;}));
  const semCausa=state.recs.filter(r=>(r.tipo==='Não conformidade'||r.tipo==='Reclamação')&&!(r.causaRaiz||'').trim()).length;
  const semEf=state.recs.filter(r=>r.estado==='Fechado'&&(!(r.eficaciaDesc||'').trim())).length;
  $('#main').innerHTML=`
    <div class="page-head"><div><span class="clause">Cláusula 9.1.3</span><h2>Análise de causas e de tendências</h2>
      <div class="sub">Agregação das causas identificadas em todos os registos. Causas recorrentes indicam falha sistémica: tratam-se no processo, não em cada ocorrência isolada.</div></div></div>
    <div class="panel"><div class="panel-head"><h3>Causas por categoria (Ishikawa)</h3></div><div class="panel-body">${barras(cat)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Causas mais frequentes</h3></div><div class="panel-body">${barras(causa)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Ocorrências por processo</h3></div><div class="panel-body">${barras(porProc)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Qualidade do tratamento</h3></div><div class="panel-body">
      <div class="bar"><span class="lab">Registos sem causa raiz descrita</span><span class="track"><i style="width:${state.recs.length?semCausa/state.recs.length*100:0}%;background:var(--bad)"></i></span><span class="val">${semCausa}</span></div>
      <div class="bar"><span class="lab">Fechados sem descrição da verificação</span><span class="track"><i style="width:${state.recs.length?semEf/state.recs.length*100:0}%;background:var(--warn)"></i></span><span class="val">${semEf}</span></div>
    </div></div>`;
}

/* ---------- reposição de dados ---------- */
function recalcSeq(){
  const seq={};
  state.recs.forEach(r=>{
    const m=String(r.codigo||'').match(/^([A-Z]+)\s*(\d+)\/(\d{4})$/);
    if(!m) return;
    const k=m[1]+m[3], n=parseInt(m[2],10);
    if(!seq[k]||n>seq[k]) seq[k]=n;
  });
  state.seq=seq;
}
function reiniciarNumeracao(){
  const antes=JSON.stringify(state.seq);
  recalcSeq();
  save();
  const depois=Object.entries(state.seq).map(([k,v])=>`${k}: ${v}`).join(' · ')||'tudo a zero';
  logH('Reposição','','Numeração recalculada a partir dos registos existentes');
  save(); render();
  toast(antes===JSON.stringify(state.seq)?'A numeração já estava correta.':`Numeração recalculada — ${depois}.`);
}
function apagarRegistos(){
  if(!state.recs.length){ toast('Já não existem registos.'); return; }
  if(!confirm(`Apagar os ${state.recs.length} registo(s) e reiniciar a numeração?\n\nO catálogo de processos e documentos é mantido.\nExporte primeiro uma cópia de segurança, se ainda não o fez.`)) return;
  if(!confirm('Confirma? Esta operação não pode ser anulada.')) return;
  const n=state.recs.length;
  state.recs=[]; state.seq={};
  logH('Reposição','',`${n} registo(s) apagados; numeração reiniciada`);
  save(); buildNav(); go('painel'); toast(`${n} registo(s) apagados. A numeração recomeça em 1.`);
}
function reporTudo(){
  if(!confirm('Repor a aplicação no estado inicial?\n\nApaga todos os registos, o histórico e as alterações ao catálogo de processos e documentos.\nExporte primeiro uma cópia de segurança, se ainda não o fez.')) return;
  if(!confirm('Confirma? Perde-se tudo o que está guardado neste navegador.')) return;
  try{ localStorage.removeItem(DB_KEY); }catch(e){}
  mem=null;
  state={recs:[],hist:[],seq:{},catalogo:{
    proc:CAT_BASE.proc.map(([cod,desig,ver,nat])=>({cod,desig,ver,nat})),
    doc:CAT_BASE.doc.map(([cod,desig,ver,nat])=>({cod,desig,ver,nat}))}};
  logH('Reposição','','Aplicação reposta no estado inicial');
  save(); buildNav(); go('painel'); toast('Aplicação reposta. Tudo recomeça do zero.');
}

/* ---------- exportação ---------- */
function download(nome,cont,mime){
  const b=new Blob([cont],{type:mime}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

/* ---------- XLS ---------- */
function xe(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cel(v){
  const s=String(v==null?'':v).trim();
  return /^-?\d+([.,]\d+)?$/.test(s)&&s!==''
    ? `<Cell><Data ss:Type="Number">${s.replace(',','.')}</Data></Cell>`
    : `<Cell><Data ss:Type="String">${xe(v)}</Data></Cell>`;
}
function expXLS(){

  'Estado','Atualizar riscos','Riscos','Mudanças no SGQ','Onde','Finalizado por','Data','Observações','Dias de tratamento','Em atraso'];

    r.estado,r.atualizaRiscos,r.riscosQuais,r.mudancasSGQ,r.mudancasOnde,r.finalizadoPor,fmtD(r.dataFinal),r.observacoes,
    (dias(r.dataOcorrencia,r.dataFinal)??''),emAtraso(r)?'Sim':'Não'];
    return `<Row>${v.map(cel).join('')}</Row>`;
  }).join('');
  const hc=`<Row>${['Código','Categoria','Causa'].map(h=>cel(h)).join('')}</Row>`;
  const rc=state.recs.flatMap(r=>linhasIshi(r).flatMap(([c,vs])=>vs.map(x=>`<Row>${[r.codigo,c,x].map(cel).join('')}</Row>`))).join('');
  const hh=`<Row>${['Data/Hora','Ação','Código','Descrição'].map(h=>cel(h)).join('')}</Row>`;
  const rh=state.hist.map(h=>`<Row>${[fmtTs(h.ts),h.acao,h.cod,h.desc].map(cel).join('')}</Row>`).join('');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Worksheet ss:Name="Registos"><Table><Row>${H1.map(cel).join('')}</Row>${rows}</Table></Worksheet>
<Worksheet ss:Name="Causas"><Table>${hc}${rc}</Table></Worksheet>
<Worksheet ss:Name="Histórico"><Table>${hh}${rh}</Table></Worksheet></Workbook>`;
  download(`ulsg-ue-nc-${stamp()}.xls`,xml,'application/vnd.ms-excel');
  logH('Exportação','','Livro XLS'); save(); toast('Exportação XLS concluída.');
}

  const desig=prompt('Designação:',e.desig); if(desig===null) return;
  const ver=prompt('Versão:',e.ver||''); if(ver===null) return;

function apagarCat(tipo,i){
  const e=state.catalogo[tipo][i];
  const n=state.recs.filter(r=>arr(r.processos).includes(e.cod)||arr(r.documentos).includes(e.cod)).length;
  if(n){ alert(`Não é possível remover: ${e.cod} está associado a ${n} registo(s).\n\nSe o documento passou a obsoleto, altere a designação ou a natureza em vez de o remover — o histórico deve manter a referência.`); return; }
  if(!confirm(`Remover ${e.cod} do catálogo?`)) return;
  state.catalogo[tipo].splice(i,1); logH('Catálogo',e.cod,'Entrada removida'); save(); render(); toast('Entrada removida.');
