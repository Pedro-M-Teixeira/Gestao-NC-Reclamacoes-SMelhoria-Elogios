function reporCat(){
  if(!confirm('Repor o catálogo conforme o ULSG.UE.Imp.009 de origem?\n\nAs entradas que acrescentou manualmente são mantidas.')) return;
  ['proc','doc'].forEach(t=>{
    CAT_BASE[t].forEach(([cod,desig,ver,nat])=>{
      const e=state.catalogo[t].find(x=>x.cod===cod);
      if(e){ e.desig=desig; e.ver=ver; e.nat=nat; } else state.catalogo[t].push({cod,desig,ver,nat});
    });
    state.catalogo[t].sort((a,b)=>a.cod.localeCompare(b.cod,'pt'));
  });
  logH('Catálogo','','Reposição do catálogo de origem'); save(); render(); toast('Catálogo reposto.');
}

/* =========================================================
   LEITURA DE .XLSX (ZIP + XML) E DE .CSV, SEM BIBLIOTECAS
   ========================================================= */
function colIdx(l){ let n=0; for(const c of l) n=n*26+(c.charCodeAt(0)-64); return n-1; }
function serieParaISO(n){
  const ms=Math.round((n-25569)*86400000);
  return new Date(ms).toISOString().slice(0,10);
}
async function lerXLSX(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-66000;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('O ficheiro não tem a estrutura de um .xlsx.');
  const nEnt=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const ficheiros={}; let p=cdOff;
  for(let i=0;i<nEnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    ficheiros[td.decode(u8.subarray(p+46,p+46+nlen))]={method,csize,lho};
    p+=46+nlen+elen+clen;
  }
  async function extrair(nome){
    const f=ficheiros[nome]; if(!f) return null;
    const ln=dv.getUint16(f.lho+26,true), le=dv.getUint16(f.lho+28,true);
    const ini=f.lho+30+ln+le, dados=u8.subarray(ini,ini+f.csize);
    if(f.method===0) return td.decode(dados);
    if(typeof DecompressionStream==='undefined')
      throw new Error('Este navegador não suporta a leitura direta de .xlsx. Guarde a folha como CSV e importe o CSV.');
    const out=await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return td.decode(out);
  }
  const ss=[], ssXml=await extrair('xl/sharedStrings.xml');
  if(ssXml){
    const d=new DOMParser().parseFromString(ssXml,'application/xml');
    Array.from(d.getElementsByTagNameNS('*','si')).forEach(si=>{
      let t=''; Array.from(si.getElementsByTagNameNS('*','t')).forEach(x=>t+=x.textContent); ss.push(t);
    });
  }
  const folha=Object.keys(ficheiros).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!folha) throw new Error('Não foi encontrada nenhuma folha de cálculo no ficheiro.');
  const d=new DOMParser().parseFromString(await extrair(folha),'application/xml');
  const linhas=[];
  Array.from(d.getElementsByTagNameNS('*','row')).forEach(r=>{
    const lin=[];
    Array.from(r.getElementsByTagNameNS('*','c')).forEach(c=>{
      const ref=(c.getAttribute('r')||'').replace(/[0-9]/g,''), t=c.getAttribute('t');
      const v=c.getElementsByTagNameNS('*','v')[0], is=c.getElementsByTagNameNS('*','is')[0];
      let val=null;
      if(t==='s'&&v) val=ss[+v.textContent];
      else if(t==='inlineStr'&&is) val=is.textContent;
      else if(t==='str'&&v) val=v.textContent;
      else if(v){ const n=parseFloat(v.textContent); val=isNaN(n)?v.textContent:n; }
      if(ref) lin[colIdx(ref)]=val;
    });
    linhas.push(lin);
  });
  return linhas;
}
function lerCSV(txt){
  if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1);
  const sep=(txt.split('\n')[0].split(';').length>txt.split('\n')[0].split(',').length)?';':',';
  const out=[]; let lin=[],campo='',asp=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(asp){ if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else asp=false; } else campo+=c; }
    else if(c==='"') asp=true;
    else if(c===sep){ lin.push(campo); campo=''; }
    else if(c==='\n'){ lin.push(campo); out.push(lin); lin=[]; campo=''; }
    else if(c!=='\r') campo+=c;
  }
  if(campo!==''||lin.length){ lin.push(campo); out.push(lin); }
  return out;
}

/* =========================================================
   CORRESPONDÊNCIA DE COLUNAS E CONVERSÃO
   ========================================================= */
function norm(t){
  return String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\u00a0/g,' ').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const MAP_EXATO={
 'tipo':'tipo','origem':'origem','data da ocorrencia':'dataOcorrencia','unidade':'unidade',
 'processo':'processoTxt','processos':'processoTxt','especificacao':'especificacao',
 'foto evidencias e outros anexos':'evidencias','o que fazer':'acaoImediata','quem vai fazer':'responsaveis',
 'quando':'dataInicio','ate quando':'dataLimite','porque 1':'p1','porque 2':'p2','porque 3':'p3','porque 4':'p4','porque 5':'p5',
 'ishikawa':'ishikawaTxt','causa raiz descricao':'causaRaizTxt','alternativa descricao detalhada':'alternativa',
 'avaliacao da eficacia':'eficacia','avaliacao da eficacia descricao':'eficaciaDesc','evidencia':'eficaciaEvid',
 'data da avaliacao':'dataAvaliacao','quem avaliou':'avaliadores','resultado':'estado',
 'ha necessidade de atualizar riscos e oportunidades':'atualizaRiscos',
 'ha necessidade de realizar mudancas no sgq':'mudancasSGQ','onde processos':'mudancasOnde',
 'quem finalizou o presente relatorio':'finalizadoPor','data':'dataFinal','id':'origemId','observacoes':'observacoes'};
const MAP_PREFIXO=[['7 how much','w_howmuch'],['6 how','w_how'],['5 who','w_who'],['4 when','w_when'],
  ['3 where','w_where'],['2 why','w_why'],['1 what','w_what']];
const IGNORAR=['hora de inicio','hora de conclusao','e mail','nome','hora da ultima modificacao'];
function mapearColuna(h){
  const n=norm(h); if(!n||IGNORAR.includes(n)) return null;
  if(MAP_EXATO[n]) return MAP_EXATO[n];
  for(const [pre,k] of MAP_PREFIXO) if(n.startsWith(pre)) return k;
  if(n.startsWith('porque')) { const m=n.match(/porque (\d)/); if(m) return 'p'+m[1]; }
  return null;
}
const V_TIPO={'analise de nao conformidades':'Não conformidade','nao conformidade':'Não conformidade',
 'nao conformidades':'Não conformidade','reclamacoes':'Reclamação','reclamacao':'Reclamação',
 'sugestoes de melhoria':'Sugestão de melhoria','sugestao de melhoria':'Sugestão de melhoria',
 'pontos fracos':'Ponto fraco','ponto fraco':'Ponto fraco','elogios':'Elogio','elogio':'Elogio'};
const V_UNID={'unidade ensino':'Unidade de Ensino','unidade de ensino':'Unidade de Ensino','biblioteca':'Biblioteca',
 'unidade ensino e biblioteca':'Unidade de Ensino e Biblioteca','unidade de ensino e biblioteca':'Unidade de Ensino e Biblioteca',
 'internato medico':'Internato Médico'};
const V_EST={'fechado':'Fechado','aberto':'Aberto','em curso':'Em curso','anulado':'Anulado'};
const V_EF={'sim':'Sim — causas eliminadas','nao':'Não — reabrir análise','parcialmente':'Parcialmente','nao aplicavel':'Não aplicável'};
const CAUSA_CAT={}; Object.entries(ISHIKAWA).forEach(([c,l])=>l.forEach(x=>CAUSA_CAT[norm(x)]=[c,x]));
function dataISO(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return serieParaISO(v);
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}
function partes(v){ return String(v==null?'':v).split(/[;\n]/).map(x=>x.trim()).filter(Boolean); }
function converterLinha(bruto){
  const r=novoDraft();
  r.tipo=V_TIPO[norm(bruto.tipo)]||(bruto.tipo?String(bruto.tipo).trim():'Sugestão de melhoria');
  r.origem=ORIGENS.find(o=>norm(o)===norm(bruto.origem))||(bruto.origem?String(bruto.origem).trim():'Outra');
  r.dataOcorrencia=dataISO(bruto.dataOcorrencia)||today();
  r.unidade=V_UNID[norm(bruto.unidade)]||(bruto.unidade?String(bruto.unidade).trim():'Unidade de Ensino');
  r.especificacao=String(bruto.especificacao||'').trim();
  r.evidencias=String(bruto.evidencias||'').trim();
  r.acaoImediata=String(bruto.acaoImediata||'').trim();
  r.responsaveis=partes(bruto.responsaveis);
  r.dataInicio=dataISO(bruto.dataInicio); r.dataLimite=dataISO(bruto.dataLimite);
  [1,2,3,4,5].forEach(i=>r['p'+i]=String(bruto['p'+i]||'').trim());
  r.alternativa=String(bruto.alternativa||'').trim();
  ['w_what','w_why','w_where','w_when','w_who','w_how','w_howmuch'].forEach(k=>r[k]=String(bruto[k]||'').trim());
  r.eficacia=V_EF[norm(bruto.eficacia)]||'Por verificar';
  r.eficaciaDesc=String(bruto.eficaciaDesc||'').trim();
  r.eficaciaEvid=String(bruto.eficaciaEvid||'').trim();
  r.dataAvaliacao=dataISO(bruto.dataAvaliacao);
  r.avaliadores=partes(bruto.avaliadores);
  r.estado=V_EST[norm(bruto.estado)]||(r.eficacia==='Por verificar'?'Em curso':'Aguarda verificação de eficácia');
  r.atualizaRiscos=/^s/i.test(String(bruto.atualizaRiscos||'').trim())?'Sim':'Não';
  r.mudancasSGQ=/^s/i.test(String(bruto.mudancasSGQ||'').trim())?'Sim':'Não';
  r.mudancasOnde=String(bruto.mudancasOnde||'').trim();
  r.finalizadoPor=PESSOAS.find(x=>norm(x)===norm(bruto.finalizadoPor))||String(bruto.finalizadoPor||'').trim();
  r.dataFinal=dataISO(bruto.dataFinal);
  // categorias de Ishikawa assinaladas no formulário de origem
  partes(bruto.ishikawaTxt).forEach(c=>{
    const cat=Object.keys(ISHIKAWA).find(k=>norm(k)===norm(c));
    if(cat) r.ishikawaOutro[cat]='Categoria assinalada no formulário de origem';
  });
  // a coluna «Causa Raiz» do formulário continha a lista de causas normalizadas
  const soltos=[];
  partes(bruto.causaRaizTxt).forEach(x=>{
    const m=CAUSA_CAT[norm(x)];
    if(m){ r.ishikawa[m[0]]=arr(r.ishikawa[m[0]]).concat([m[1]]); } else soltos.push(x);
  });
  r.causaRaiz=soltos.join('; ');
  // processos e documentos a partir do texto livre
  const txt=[bruto.processoTxt,bruto.mudancasOnde].filter(Boolean).join(' ; ');
  const achados=new Set((String(txt).match(/ULSG\.(?:UE\.)?(?:PQ|PI|PO|Imp|Mod|Reg|PL|Rel|IT|Man)\.\d{3}/gi)||[])
    .map(c=>c.replace(/ULSG\.UE\.(Man)/i,'ULSG.$1')));
  const aviso=[];
  achados.forEach(c=>{
    const e=catEntry(c);
    if(!e){ aviso.push(c); return; }
    const dest=state.catalogo.proc.includes(e)?'processos':'documentos';
    if(!r[dest].includes(c)) r[dest]=r[dest].concat([c]);
  });
  const livre=String(bruto.processoTxt||'').trim();
  if(livre && !/^ULSG/i.test(livre.replace(/\s/g,'').slice(0,4))) r.processosTexto=livre;
  else if(aviso.length) r.processosTexto=aviso.join('; ');
  r.observacoes=[bruto.origemId?`Registo migrado do formulário Microsoft Forms (ID de origem ${bruto.origemId}).`:'',
    String(bruto.observacoes||'').trim()].filter(Boolean).join(' ');
  r._naoMapeado=aviso;
  return r;
}

/* =========================================================
   ECRÃ DE IMPORTAÇÃO
   ========================================================= */
let impPrev=null;
function duplicado(r){
  const chave=t=>norm(t).slice(0,30);
  return state.recs.find(x=>
    (x.especificacao&&r.especificacao&&x.especificacao.trim()===r.especificacao.trim())||
    (x.dataOcorrencia===r.dataOcorrencia&&chave(x.especificacao)&&chave(x.especificacao)===chave(r.especificacao)));
}
$('#importXls').addEventListener('change',async function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  try{
    let linhas;
    if(/\.csv$/i.test(f.name)) linhas=lerCSV(await f.text());
    else linhas=await lerXLSX(await f.arrayBuffer());
    linhas=linhas.filter(l=>l&&l.some(c=>c!=null&&String(c).trim()!==''));
    if(linhas.length<2) throw new Error('A folha não tem linhas de dados.');
    const cab=linhas[0], mapa=cab.map(mapearColuna);
    const reconhecidas=mapa.filter(Boolean).length;
    if(reconhecidas<5) throw new Error('Não foi possível reconhecer as colunas. Confirme que a primeira linha contém os títulos das perguntas do formulário.');
    const brutos=linhas.slice(1).map(l=>{ const o={}; mapa.forEach((k,i)=>{ if(k&&l[i]!=null&&String(l[i]).trim()!=='') o[k]=l[i]; }); return o; })
      .filter(o=>Object.keys(o).length>1);
    const regs=brutos.map(converterLinha);
    regs.forEach(r=>{ const d=duplicado(r); if(d){ r._dup=d.codigo; r._skip=true; } });
    regs.sort((a,b)=>(a.dataOcorrencia||'').localeCompare(b.dataOcorrencia||''));
    impPrev={ficheiro:f.name,cab,mapa,regs,
      ignoradas:cab.filter((h,i)=>!mapa[i]&&String(h||'').trim()&&!IGNORAR.includes(norm(h)))};
    go('importar');
  }catch(e){ alert('Não foi possível ler o ficheiro.\n\n'+(e.message||e)); }
});
function telaImport(){
  if(!impPrev){ go('exportar'); return; }
  const P=impPrev;
  const porTipo={}; P.regs.forEach(r=>porTipo[r.tipo]=(porTipo[r.tipo]||0)+1);
  const semProc=P.regs.filter(r=>!r.processos.length&&!r.documentos.length).length;
  const naoMap=[...new Set(P.regs.flatMap(r=>r._naoMapeado||[]))];
  const dup=P.regs.filter(r=>r._dup).length;
  const tab=P.regs.map((r,i)=>`<tr>
    <td>${chip(r.tipo,CH_TIPO)}</td><td>${fmtD(r.dataOcorrencia)}</td>
    <td><span class="trunc" title="${esc(r.especificacao)}">${esc(r.especificacao)||'—'}</span>${r._dup?`<br><span class="chip warn">possível duplicado de ${esc(r._dup)}</span>`:''}</td>
    <td><span class="trunc" style="max-width:150px">${esc(r.processos.concat(r.documentos).map(c=>c.replace('ULSG.UE.','')).join(', '))||'—'}</span></td>
    <td>${chip(r.estado,CH_EST)}</td>
    <td><label style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" ${r._skip?'':'checked'} onchange="impPrev.regs[${i}]._skip=!this.checked">importar</label></td></tr>`).join('');
  $('#main').innerHTML=`
    <div class="page-head"><div><span class="clause">Importação</span><h2>Pré-visualização</h2>
      <div class="sub">Ficheiro <strong>${esc(P.ficheiro)}</strong> — ${P.regs.length} registo(s) detetado(s), ${P.mapa.filter(Boolean).length} coluna(s) reconhecida(s). Confirme antes de importar; nada é gravado até premir «Importar».</div></div>
      <div class="actions-row"><button class="btn" onclick="impPrev=null;go('exportar')">Cancelar</button>
      <button class="btn primary" onclick="confirmarImport()">Importar registos</button></div></div>
    <div class="panel"><div class="panel-head"><h3>Modo de importação</h3></div>
      <div class="panel-body" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <button class="btn ${P.modo!=='substituir'?'primary':''}" onclick="modoImport('acrescentar')">Acrescentar aos existentes</button>
        <button class="btn ${P.modo==='substituir'?'primary':''}" onclick="modoImport('substituir')">Substituir tudo e renumerar</button>
        <span style="font-size:12.5px;color:var(--ink-soft);flex:1;min-width:230px">${P.modo==='substituir'
          ? 'Os '+state.recs.length+' registo(s) atuais são apagados e a numeração recomeça em 1 para cada tipo e ano.'
          : 'Os registos são acrescentados; a numeração continua a partir do último código de cada tipo e ano.'}</span>
      </div></div>
    ${semProc?`<div class="alertbox">${semProc} registo(s) sem processo ou documento identificado — a coluna «Processo» do formulário continha texto livre, que foi preservado no campo «Outra referência».</div>`:''}
    ${naoMap.length?`<div class="alertbox">Referências encontradas que não constam do catálogo: ${esc(naoMap.join(', '))}. Pode acrescentá-las em «Processos e documentos» e depois corrigir os registos.</div>`:''}
    ${dup&&P.modo!=='substituir'?`<div class="alertbox bad">${dup} registo(s) correspondem a registos já existentes e foram <strong>desmarcados</strong>. Marque-os apenas se pretender mesmo duplicar.</div>`:''}
    ${P.ignoradas.length?`<div class="alertbox info">Colunas não utilizadas: ${esc(P.ignoradas.join(', '))}.</div>`:''}
    <div class="panel"><div class="panel-head"><h3>Distribuição por tipo</h3></div>
      <div class="panel-body">${barras(porTipo)}</div></div>
    <div class="panel"><div class="panel-head"><h3>Registos a importar</h3></div>
      <div class="table-wrap"><table class="grid"><thead><tr><th>Tipo</th><th>Data</th><th>Especificação</th><th>Processos / documentos</th><th>Estado</th><th></th></tr></thead>
      <tbody>${tab}</tbody></table></div></div>`;
}
function modoImport(m){
  if(!impPrev) return;
  impPrev.modo=m;
  if(m==='substituir') impPrev.regs.forEach(r=>{ r._skip=false; });
  else impPrev.regs.forEach(r=>{ const d=duplicado(r); r._dup=d?d.codigo:null; r._skip=!!d; });
  telaImport();
}
function confirmarImport(){
  if(!impPrev) return;
  const sel=impPrev.regs.filter(r=>!r._skip);
  if(!sel.length){ toast('Nenhum registo selecionado.'); return; }
  if(impPrev.modo==='substituir'){
    if(state.recs.length && !confirm(`Substituir os ${state.recs.length} registo(s) atuais pelos ${sel.length} registo(s) a importar?\n\nA numeração recomeça em 1. Esta operação não pode ser anulada.`)) return;
    const antes=state.recs.length;
    state.recs=[]; state.seq={};
    if(antes) logH('Reposição','',`${antes} registo(s) substituídos na importação`);
  }
  let n=0;
  sel.forEach(r=>{
    const ano=(r.dataOcorrencia||today()).slice(0,4);
    const rec=Object.assign({id:uid(),codigo:codigo(r.tipo,ano),criadoEm:nowISO(),importadoEm:nowISO()},r);
    delete rec._skip; delete rec._naoMapeado; delete rec._dup;
    state.recs.push(rec); n++;
  });
  state.recs.sort((a,b)=>(b.dataOcorrencia||'').localeCompare(a.dataOcorrencia||''));
  logH('Importação','',`${n} registo(s) de «${impPrev.ficheiro}»`);
  save(); impPrev=null; buildNav(); go('registos');
  toast(`${n} registo(s) importado(s).`);
}


/* =========================================================
   SALVAGUARDA DOS DADOS
   O armazenamento do navegador é apagável pelo utilizador e
   pelas políticas do posto de trabalho. Daí a cópia automática.
   ========================================================= */
function diasDesdeBackup(){
  if(!state.backup||!state.backup.ultimo) return null;
  return Math.floor((Date.now()-new Date(state.backup.ultimo))/86400000);
}
function riscoBackup(){
  const p=(state.backup&&state.backup.pendentes)||0, d=diasDesdeBackup();
  if(!state.recs.length) return null;
  if(d===null) return {n:'bad',t:'Nunca foi feita uma cópia de segurança destes dados.'};
  if(d>=7||p>=25) return {n:'bad',t:`Última cópia há ${d} dia(s), com ${p} alteração(ões) por salvaguardar.`};
  if(p>0&&d>=2) return {n:'',t:`Última cópia há ${d} dia(s), com ${p} alteração(ões) por salvaguardar.`};
  return null;
}
function bannerBackup(){
  const r=riscoBackup(); if(!r) return '';
  return `<div class="alertbox ${r.n}" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span style="flex:1;min-width:240px">${r.t} Os dados vivem no armazenamento deste navegador: limpar «cookies e dados de sites» elimina-os.</span>
    <button class="btn small" onclick="expJSON()">Exportar agora</button>
    <button class="btn small" onclick="go('exportar')">Cópia automática</button></div>`;
}

/* --- guardar o identificador do ficheiro de cópia entre sessões --- */
function idbAbrir(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined') return rej(new Error('sem indexedDB'));
    const r=indexedDB.open('ulsg_ue_nc',1);
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbPor(k,v){ try{ const d=await idbAbrir(); await new Promise((res,rej)=>{
  const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
async function idbLer(k){ try{ const d=await idbAbrir(); return await new Promise((res,rej)=>{
  const t=d.transaction('kv','readonly'); const q=t.objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }

let autoHandle=null, autoEstado='inativa', autoTimer=null;
function autoSuportada(){ return typeof window!=='undefined' && typeof window.showSaveFilePicker==='function'; }
async function ativarAuto(){
  if(!autoSuportada()){
    alert('Este navegador não permite gravar diretamente num ficheiro.\n\nFuncionalidade disponível no Chrome e no Edge. Em alternativa, exporte o JSON manualmente com regularidade.');
    return;
  }
  try{
    const h=await window.showSaveFilePicker({suggestedName:'ulsg-ue-nc-copia-automatica.json',
      types:[{description:'Cópia de segurança JSON',accept:{'application/json':['.json']}}]});
    autoHandle=h; await idbPor('autoHandle',h);
    autoEstado='ativa';
    await gravarAuto(true);
    render(); toast('Cópia automática ativada.');
  }catch(e){ if(e&&e.name!=='AbortError') alert('Não foi possível ativar a cópia automática.\n\n'+(e.message||e)); }
}
async function desativarAuto(){
  autoHandle=null; autoEstado='inativa'; await idbPor('autoHandle',null);
  render(); toast('Cópia automática desativada.');
}
function agendarAuto(){
  if(!autoHandle||autoEstado!=='ativa') return;
  clearTimeout(autoTimer); autoTimer=setTimeout(()=>gravarAuto(false),1500);
}
async function gravarAuto(comGesto){
  if(!autoHandle) return false;
  try{
    if(autoHandle.queryPermission){
      let perm=await autoHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        if(!comGesto){ autoEstado='autorizar'; return false; }
        perm=await autoHandle.requestPermission({mode:'readwrite'});
        if(perm!=='granted'){ autoEstado='autorizar'; return false; }
      }
    }
    const w=await autoHandle.createWritable();
    await w.write(JSON.stringify({aplicacao:'ULSG · UE — Análise de NC, Reclamações, SM e Elogios',
      versao:1,exportadoEm:nowISO(),dados:state},null,2));
    await w.close();
    autoEstado='ativa';
    state.backup={ultimo:nowISO(),pendentes:0}; persistRaw();
    return true;
  }catch(e){ autoEstado='erro'; return false; }
}
async function retomarAuto(){
  const ok=await gravarAuto(true);
  render(); toast(ok?'Cópia automática retomada.':'Não foi possível aceder ao ficheiro. Escolha-o novamente.');
}
async function iniciarSalvaguarda(){
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const h=await idbLer('autoHandle');
  if(h){
    autoHandle=h;
    try{
      const perm=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
      autoEstado = perm==='granted' ? 'ativa' : 'autorizar';
      if(autoEstado==='ativa') gravarAuto(false);
    }catch(e){ autoEstado='autorizar'; }
    if(view==='painel'||view==='exportar') render();
  }
}
function painelAuto(){
  const est={
    inativa:['neutral','Inativa','Nenhum ficheiro de cópia definido.'],
    ativa:['ok','Ativa','Cada alteração é gravada no ficheiro que escolheu.'],
    autorizar:['warn','Por autorizar','O navegador precisa que confirme de novo o acesso ao ficheiro, nesta sessão.'],
    erro:['bad','Com erro','A última gravação falhou. O ficheiro pode ter sido movido ou apagado.']
  }[autoEstado]||['neutral','Inativa',''];
  const d=diasDesdeBackup();
  return `<div class="panel"><div class="panel-head"><h3>Cópia automática</h3><span class="chip ${est[0]}">${est[1]}</span></div>
    <div class="panel-body">
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px">${est[2]}
        Escolha um ficheiro numa pasta de rede ou numa pasta sincronizada e a aplicação grava aí uma cópia JSON sempre que algo muda.
        É a forma de não depender do armazenamento do navegador.
        ${autoSuportada()?'':'<br><strong>Este navegador não suporta esta funcionalidade</strong> — disponível no Chrome e no Edge. Em alternativa, exporte o JSON com regularidade.'}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${autoEstado==='autorizar'?'<button class="btn primary" onclick="retomarAuto()">Autorizar e retomar</button>':''}
        <button class="btn ${autoEstado==='ativa'?'':'primary'}" onclick="ativarAuto()" ${autoSuportada()?'':'disabled'}>${autoEstado==='inativa'?'Escolher ficheiro de cópia':'Escolher outro ficheiro'}</button>
        ${autoEstado!=='inativa'?'<button class="btn danger" onclick="desativarAuto()">Desativar</button>':''}
      </div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:12px">
        Última cópia: <strong>${state.backup&&state.backup.ultimo?fmtTs(state.backup.ultimo)+(d!==null?` (há ${d} dia(s))`:''):'nunca'}</strong> ·
        alterações por salvaguardar: <strong>${(state.backup&&state.backup.pendentes)||0}</strong>
      </div>
    </div></div>`;
}

/* ---------- arranque ---------- */
buildNav(); render(); iniciarSalvaguarda();
</script>
